<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Deckhand</title>
  <desc id="d">Deckhand: a visual editor for HTML presentations</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="170" fill="url(#ac)" opacity=".13"/>
  <circle cx="930" cy="290" r="120" fill="#38bdf8" opacity=".08"/>

  <!-- the slide, being edited -->
  <g filter="url(#sh)" transform="translate(70 60)">
    <rect width="250" height="156" rx="10" fill="#0b1220" stroke="#334155"/>
    <rect x="22" y="24" width="120" height="14" rx="4" fill="#e2e8f0"/>
    <rect x="22" y="46" width="170" height="8" rx="4" fill="#64748b"/>
    <rect x="22" y="62" width="140" height="8" rx="4" fill="#64748b"/>
    <circle cx="192" cy="104" r="30" fill="url(#ac)"/>
    <rect x="22" y="104" width="86" height="26" rx="13" fill="url(#ac)"/>
    <!-- selection box and handles -->
    <rect x="14" y="94" width="104" height="46" fill="none" stroke="#f97316" stroke-width="2"/>
    <g fill="#fff" stroke="#f97316" stroke-width="2">
      <rect x="10" y="90" width="8" height="8"/><rect x="62" y="90" width="8" height="8"/><rect x="114" y="90" width="8" height="8"/>
      <rect x="10" y="132" width="8" height="8"/><rect x="62" y="132" width="8" height="8"/><rect x="114" y="132" width="8" height="8"/>
      <rect x="10" y="111" width="8" height="8"/><rect x="114" y="111" width="8" height="8"/>
    </g>
    <!-- cursor -->
    <path d="M150 116 L150 158 L161 148 L169 166 L178 162 L170 144 L184 143 Z" fill="#fff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <text x="380" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" fill="#f8fafc" letter-spacing="-2">Deckhand</text>
  <rect x="384" y="160" width="150" height="6" rx="3" fill="url(#ac)"/>
  <text x="382" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#cbd5e1">PowerPoint for HTML decks.</text>
  <text x="382" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94a3b8">Click, drag, type, save. The file changes only where you did.</text>
</svg>
