name: Diagnose
on:
  push:
    branches: [ci-diag]
jobs:
  diag:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Focus diagnostic (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test e2e/focus-diagnostic.spec.ts
      - name: Focus diagnostic
        if: runner.os != 'Linux'
        run: npx playwright test e2e/focus-diagnostic.spec.ts
